[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawvla"
version = "0.1.0"
description = "Multi-component ClawVLA runtime scaffold for RoboTwin-style manipulation agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "openai>=1.0.0",
    "pillow",
    "pyyaml",
    "rich>=13.0.0",
]

[project.optional-dependencies]
local = ["transformers", "torch"]
vllm = ["vllm", "qwen-vl-utils"]
openpi-torch = ["torch", "transformers==4.53.2", "safetensors"]

[project.scripts]
clawvla-inspect = "clawvla.scripts.inspect_stack:main"
clawvla-artifact-smoke = "clawvla.scripts.artifact_smoke:main"
clawvla-geometry-smoke = "clawvla.scripts.geometry_smoke:main"
clawvla-robotwin-capture-once = "clawvla.scripts.robotwin_capture_once:main"
clawvla-run-profile = "clawvla.scripts.run_profile:main"
clawvla-rl = "clawvla.rl.openrlhf_runner:main"
clawvla-libero-capture-once = "clawvla.scripts.libero_capture_once:main"
clawvla-libero-pi05-execute-once = "clawvla.scripts.libero_pi05_execute_once:main"
clawvla-pi05-libero-action-smoke = "clawvla.scripts.pi05_libero_action_smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "calvin_integration: requires a configured CALVIN Python, dataset, and simulator runtime",
]
