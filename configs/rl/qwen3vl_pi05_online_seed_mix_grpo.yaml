extends:
  - qwen3vl_pi05_grpo.yaml
  - rewards/robotwin.yaml
  - tasks/robotwin_all.yaml

name: qwen3vl_pi05_online_seed_mix_grpo

rollout:
  max_steps: 150
  run_robotwin: true
  start_openpi_worker: true
  episodes: 1
  group_size: 4
  artifact_prefix: clawvla_rl_online_seed_mix
  episode_timeout_s: 1800.0
  openpi_port_base: 9365
  # The action model is frozen during VLM GRPO.  Keep one OpenPI model copy per
  # OpenPI GPU for the whole run, and keep four RoboTwin lane processes alive
  # while recreating a clean scene for every trajectory.
  persistent_openpi_workers: true
  openpi_worker_count: 2
  persistent_robotwin_workers: true
  robotwin_worker_count: 4
  robotwin_worker_port_base: 19365

rollout_seed_mix:
  enabled: true
  valid_seed_cache_dir: ${PROJECT_ROOT}/runs/eval/robotwin_train_grounding_valid_seeds_seed2_30/valid_seeds
  expert_plan_ratio: 0.6
  shuffle_seed: 42
  max_grounding_seeds: null
  max_prompts: null

openrlhf:
  rollout_n: 4
  # One 8B rollout replica fits on each 80 GB policy GPU.  TP=1 also avoids
  # the vLLM 0.11 / Ray 2.49 compiled-DAG semaphore deadlock seen with
  # concurrent multimodal requests at TP=2.
  tensor_parallel_size: 1
  # Verified end-to-end with Qwen3-VL multimodal rollout, vLLM sleep/wake,
  # optimizer update, hot weight broadcast, and final HF export.
  enforce_eager: false
  gpu_memory_utilization: 0.7
  kl_init_coef: 0.001
  total_epochs: 1
  total_training_steps: null

cluster:
  policy_gpus:
    - 0
    - 1
    - 2
    - 3
  openpi_gpus:
    - 4
    - 5
  robotwin_gpus:
    - 6
    - 7
  ray_num_workers: 4

checkpoint:
  # A full online update currently takes tens of minutes; save often enough
  # that a preemption does not discard multiple days of rollout/optimizer work.
  save_freq: 10
  keep_last: null

logging:
  wandb_mode: online
  wandb_project: clawvla-agent-rl
  wandb_group: robotwin-online-seed-mix-grpo
  wandb_tags:
    - qwen3vl-8b
    - robotwin
    - pi05
    - grpo
    - cuda-graph
  # Decoded samples are large; scalar metrics are still uploaded every step.
  wandb_sample_log_freq: 20

metadata:
  notes: Online GRPO over exact expert-plan seeds plus official valid grounding-only seeds; no offline grounding JSON is required.
