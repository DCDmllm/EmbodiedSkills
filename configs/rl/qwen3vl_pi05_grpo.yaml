name: qwen3vl_pi05_grpo

trainer:
  python: ${PROJECT_ROOT}/.venv-openrlhf-py310-cu128/bin/python
  cwd: ${PROJECT_ROOT}
  env:
    PYTHONPATH: ${PROJECT_ROOT}/src

robotwin:
  python: /mnt/wangwai/miniconda3/envs/robotwin-py312/bin/python
  cwd: ${PROJECT_ROOT}
  unset_env:
    - PYTHONPATH
  env:
    PYTHONPATH: /mnt/wangwai/tmp_pytorch3d_target:${PROJECT_ROOT}/src

openpi:
  python: /mnt/wangwai/miniconda3/envs/openpi-torch-py312/bin/python
  cwd: ${PROJECT_ROOT}
  env:
    PYTHONPATH: ${PROJECT_ROOT}/src:${WORKSPACE_ROOT}/pi0.5/src

policy:
  model_path: /mnt/wangwai/weights/Qwen/Qwen3-VL-8B-Instruct
  served_model_name: clawvla-policy
  roles:
    - vision
    - scheduler
    - verifier
    - recovery
  max_new_tokens: 2048
  temperature: 1.0
  request_timeout: 1800.0
  proxy_host: 127.0.0.1
  proxy_port: 18080
  api_key: clawvla-rl-policy

rollout:
  base_config: ${PROJECT_ROOT}/configs/robotwin_pi05_subtasks_25k.json
  instruction: place the container on the plate
  initial_stage: observe
  max_steps: 150
  run_robotwin: true
  episodes: 4
  group_size: 4
  artifact_prefix: clawvla_rl_qwen3vl_pi05
  task_name: place_container_plate
  seeds:
    - 0
    - 1
    - 2
    - 3
  episode_timeout_s: 1800.0
  openpi_port_base: 8765

reward:
  registry:
    - clawvla.rl.reward_registry:register_builtin_robotwin
  task_map:
    place_container_plate: robotwin
    stack_blocks_two: robotwin
    open_laptop: robotwin
    handover_mic: robotwin
    handover_block: robotwin
    press_stapler: robotwin
    click_bell: robotwin
    click_alarmclock: robotwin
    lift_pot: robotwin
    grab_roller: robotwin
    blocks_ranking_rgb: robotwin
  step_cost: 0.05
  incomplete_episode_penalty: -1.0
  premature_finish_penalty: -4.0
  stalled_loop_penalty: -8.0
  invalid_decision_penalty: -2.0
  skill_failure_penalty: -1.0
  recoverable_preflight_penalty: -0.1
  infra_failure_reward: null

planner_aux:
  enabled: true
  dataset_root: ${PROJECT_ROOT}/runs/data/robotwin_expert_subtasks_train_50x50_merged
  repair_ledger: ${PROJECT_ROOT}/runs/data/robotwin_expert_subtasks_train_50x50_merged/annotation_repairs/subtask_repairs_gpt-5.6-sol_all_unpolished.jsonl
  split_manifest: ${PROJECT_ROOT}/runs/data/robotwin_expert_subtasks_train_50x50_merged/splits/task_stratified_seed42_val5.json
  split_name: train
  advantage_weight: 0.2
  max_reference_plans_per_task: 64

openrlhf:
  env: openrlhf-py310-cu128
  algorithm: grpo
  train_mode: full
  lora_merge_for_rollout: false
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_exclude_modules: null
  force_full_gpu_workers: false
  dtype: bfloat16
  flash_attention: true
  tensor_parallel_size: 2
  rollout_n: 4
  max_prompt_length: 32768
  max_response_length: 32768
  max_model_len: 65536
  max_num_batched_tokens: 65536
  gpu_memory_utilization: 0.7
  gradient_checkpointing: true
  kl_init_coef: 0.001

cluster:
  gpus:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
  policy_gpus:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
  openpi_gpus:
    - 6
  robotwin_gpus:
    - 7
  ray_num_workers: 4

logging:
  run_root: ${PROJECT_ROOT}/runs/rl
  tmp_root: ${PROJECT_ROOT}/tmp_runs/rl
  rich: true
  wandb_mode: disabled
  wandb_project: clawvla-agent-rl
  wandb_entity: null
  wandb_tags:
    - qwen3vl
    - robotwin
    - pi05
  upload_artifacts: false

checkpoint:
  output_dir: ${PROJECT_ROOT}/checkpoints/rl
  save_freq: 20
  keep_last: 3
  resume: null

metadata:
  notes: Unified VLM policy RL with frozen OpenPI/VLA backend.
