extends:
  - qwen3vl_pi05_grpo.yaml
  - rewards/calvin.yaml
  - tasks/calvin_smoke.yaml

name: qwen3vl_calvin_xvla_1update

environment:
  python: /mnt/wangwai/miniconda3/envs/calvin-py38/bin/python
  cwd: /mnt/wangwai/vla/clawvla
  unset_env:
    - PYTHONPATH
  env:
    PYTHONPATH: /mnt/wangwai/vla/clawvla/src:/mnt/wangwai/vla/CALVIN/calvin_env:/mnt/wangwai/vla/CALVIN/calvin_models
    PYOPENGL_PLATFORM: egl
    __EGL_VENDOR_LIBRARY_DIRS: /usr/share/glvnd/egl_vendor.d
    http_proxy: http://10.20.5.5:20171
    https_proxy: http://10.20.5.5:20171

rollout:
  base_config: /mnt/wangwai/vla/clawvla/configs/calvin_xvla_enabled_probe.json
  max_steps: 8
  run_environment: true
  run_robotwin: true
  start_openpi_worker: false
  episodes: 1
  group_size: 2
  seeds:
    - 0
  artifact_prefix: clawvla_rl_calvin_xvla
  task_name: calvin_move_slider_left
  instruction: move the slider left
  episode_timeout_s: 1800.0

openrlhf:
  train_mode: full
  lora_merge_for_rollout: false
  force_full_gpu_workers: false
  flash_attention: true
  gradient_checkpointing: true
  rollout_n: 2
  tensor_parallel_size: 1
  max_prompt_length: 8192
  max_response_length: 2048
  max_model_len: 16384
  max_num_batched_tokens: 16384
  max_num_seqs: 4
  gpu_memory_utilization: 0.45
  fsdp_param_offload: true
  fsdp_optimizer_offload: true
  total_epochs: 1
  total_training_steps: 1
  actor_ppo_mini_batch_size: 1
  actor_ppo_micro_batch_size_per_gpu: 1
  actor_ppo_max_token_len_per_gpu: 8192
  rollout_log_prob_micro_batch_size_per_gpu: 1
  ref_log_prob_micro_batch_size_per_gpu: 1
  val_before_train: false
  test_freq: -1

cluster:
  policy_gpus:
    - 2
    - 3
  openpi_gpus: []
  robotwin_gpus:
    - 7
  ray_num_workers: 1

logging:
  wandb_tags:
    - qwen3vl
    - calvin
    - xvla
    - grpo

checkpoint:
  save_freq: -1
  keep_last: 1

metadata:
  notes: One-update OpenRLHF GRPO smoke for CALVIN loop integration with a real external X-VLA/CALVIN HTTP action server.
