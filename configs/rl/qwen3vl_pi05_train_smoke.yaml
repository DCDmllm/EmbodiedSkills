extends:
  - qwen3vl_pi05_grpo.yaml

name: qwen3vl_pi05_train_smoke

rollout:
  max_steps: 1
  run_robotwin: false
  episodes: 1
  group_size: 1
  artifact_prefix: clawvla_rl_train_smoke
  seeds:
    - 0
  episode_timeout_s: 600.0
  start_openpi_worker: false

openrlhf:
  train_mode: full
  lora_merge_for_rollout: false
  force_full_gpu_workers: false
  rollout_n: 2
  total_epochs: 1
  total_training_steps: 1
  max_prompt_length: 8192
  max_response_length: 1024
  max_model_len: 12288
  max_num_batched_tokens: 12288
  max_num_seqs: 4
  gpu_memory_utilization: 0.35
  actor_ppo_mini_batch_size: 1
  actor_ppo_micro_batch_size_per_gpu: 1
  actor_ppo_max_token_len_per_gpu: 12288
  rollout_log_prob_micro_batch_size_per_gpu: 1
  ref_log_prob_micro_batch_size_per_gpu: 1
  fsdp_param_offload: true
  fsdp_optimizer_offload: true
  val_before_train: false
  test_freq: -1

cluster:
  policy_gpus:
    - 2
    - 4
  openpi_gpus: []
  robotwin_gpus: []
  ray_num_workers: 1

checkpoint:
  save_freq: -1
  keep_last: 1

metadata:
  notes: Minimal real OpenRLHF train smoke. RoboTwin/OpenPI disabled; validates training loop wiring.
