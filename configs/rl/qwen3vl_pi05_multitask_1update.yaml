extends:
  - qwen3vl_pi05_grpo.yaml
  - rewards/robotwin.yaml
  - tasks/robotwin_all.yaml

name: qwen3vl_pi05_multitask_1update

rollout:
  max_steps: 20
  run_robotwin: true
  start_openpi_worker: true
  episodes: 1
  group_size: 1
  seeds:
    - 0
  artifact_prefix: clawvla_rl_multitask
  episode_timeout_s: 1800.0
  openpi_port_base: 9365

openrlhf:
  train_mode: full
  lora_merge_for_rollout: false
  force_full_gpu_workers: false
  flash_attention: true
  gradient_checkpointing: true
  rollout_n: 4
  tensor_parallel_size: 1
  max_prompt_length: 8192
  max_response_length: 2048
  max_model_len: 16384
  max_num_batched_tokens: 16384
  gpu_memory_utilization: 0.45
  fsdp_param_offload: true
  fsdp_optimizer_offload: true
  total_epochs: 1
  total_training_steps: 1
  actor_ppo_mini_batch_size: 1
  actor_ppo_micro_batch_size_per_gpu: 1
  actor_ppo_max_token_len_per_gpu: 8192
  rollout_log_prob_micro_batch_size_per_gpu: 1
  ref_log_prob_micro_batch_size_per_gpu: 1

cluster:
  policy_gpus:
    - 2
    - 3
    - 4
    - 5
  openpi_gpus:
    - 6
  robotwin_gpus:
    - 7
  ray_num_workers: 1

checkpoint:
  save_freq: -1
  keep_last: 1

metadata:
  notes: Real RoboTwin/OpenPI multitask OpenRLHF GRPO config. Each listed task becomes one prompt group; rollout_n controls samples per task prompt.
