extends:
  - qwen3vl_pi05_grpo.yaml
  - rewards/libero.yaml
  - tasks/libero_object_smoke.yaml

name: qwen3vl_pi05_libero_multitask_1update

planner_aux:
  enabled: false

environment:
  python: /mnt/wangwai/miniconda3/envs/robotwin-py312/bin/python
  cwd: ${PROJECT_ROOT}
  unset_env:
    - PYTHONPATH
  env:
    PYTHONPATH: ${PROJECT_ROOT}/src:/mnt/wangwai/lerobot/src
    MUJOCO_GL: egl
    PYOPENGL_PLATFORM: egl
    __EGL_VENDOR_LIBRARY_DIRS: /usr/share/glvnd/egl_vendor.d
    VK_ICD_FILENAMES: /etc/vulkan/icd.d/nvidia_icd.json

rollout:
  base_config: ${PROJECT_ROOT}/configs/libero_pi05_enabled_probe.json
  max_steps: 4
  run_environment: true
  run_robotwin: true
  start_openpi_worker: false
  episodes: 2
  group_size: 4
  seeds:
    - 0
  artifact_prefix: clawvla_rl_libero_multitask
  task_name: libero_object_0
  instruction: pick up the alphabet soup and place it in the basket
  episode_timeout_s: 1800.0
  openpi_port_base: 9465

openrlhf:
  train_mode: full
  lora_merge_for_rollout: false
  force_full_gpu_workers: false
  flash_attention: true
  gradient_checkpointing: true
  rollout_n: 4
  tensor_parallel_size: 1
  max_prompt_length: 8192
  max_response_length: 2048
  max_model_len: 16384
  max_num_batched_tokens: 16384
  max_num_seqs: 8
  gpu_memory_utilization: 0.45
  fsdp_param_offload: true
  fsdp_optimizer_offload: true
  total_epochs: 1
  total_training_steps: 1
  actor_ppo_mini_batch_size: 1
  actor_ppo_micro_batch_size_per_gpu: 1
  actor_ppo_max_token_len_per_gpu: 8192
  rollout_log_prob_micro_batch_size_per_gpu: 1
  ref_log_prob_micro_batch_size_per_gpu: 1
  val_before_train: false
  test_freq: -1

cluster:
  policy_gpus:
    - 2
    - 3
  openpi_gpus: []
  robotwin_gpus:
    - 7
  ray_num_workers: 1

logging:
  wandb_tags:
    - qwen3vl
    - libero
    - pi05
    - grpo

checkpoint:
  save_freq: -1
  keep_last: 1

metadata:
  notes: Real LIBERO multitask OpenRLHF GRPO smoke. Each listed LIBERO task becomes one prompt group; rollout_n controls samples per task prompt. max_steps is intentionally short to validate real multimodal rollout plus one training update before long execute-phase RL runs.
