extends:
  - qwen3vl_groot_robocasa_rollout_smoke.yaml

name: qwen3vl_groot_robocasa_1update

rollout:
  max_steps: 20
  episodes: 1
  group_size: 1
  artifact_prefix: clawvla_rl_robocasa_groot_1update
  episode_timeout_s: 2400.0
  openpi_port_base: 9966

openrlhf:
  train_mode: full
  lora_merge_for_rollout: false
  force_full_gpu_workers: false
  rollout_n: 2
  tensor_parallel_size: 1
  total_epochs: 1
  total_training_steps: 1
  max_prompt_length: 8192
  max_response_length: 2048
  max_model_len: 12288
  max_num_batched_tokens: 12288
  max_num_seqs: 4
  gpu_memory_utilization: 0.35
  actor_ppo_mini_batch_size: 1
  actor_ppo_micro_batch_size_per_gpu: 1
  actor_ppo_max_token_len_per_gpu: 12288
  rollout_log_prob_micro_batch_size_per_gpu: 1
  ref_log_prob_micro_batch_size_per_gpu: 1
  fsdp_param_offload: true
  fsdp_optimizer_offload: true
  val_before_train: false
  test_freq: -1

cluster:
  policy_gpus:
    - 2
    - 3
  openpi_gpus:
    - 6
  robotwin_gpus:
    - 7
  ray_num_workers: 1

checkpoint:
  save_freq: -1
  keep_last: 1

metadata:
  notes: One-update OpenRLHF GRPO smoke for local Qwen3-VL policy with frozen GR00T action backend in real RoboCasa.
