### Run from the ClawVLA repository root after building the mixed dataset.
### cd /path/to/clawvla
### DISABLE_VERSION_CHECK=1 PYTHONPATH=/mnt/wangwai/LLaMA-Factory/src \
###   /mnt/wangwai/miniconda3/envs/llm/bin/python -m llamafactory.cli train \
###   configs/sft/qwen3vl8b_robotwin_planner_grounding.yaml

model_name_or_path: /mnt/wangwai/weights/Qwen/Qwen3-VL-8B-Instruct
trust_remote_code: true
flash_attn: fa2

stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: /mnt/wangwai/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

dataset_dir: runs/data/robotwin_planner_grounding_sft
dataset: robotwin_planner_grounding_train
eval_dataset: robotwin_planner_grounding_val
template: qwen3_vl_nothink
enable_thinking: false
cutoff_len: 4096
max_samples: 10000000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

output_dir: checkpoints/sft/qwen3vl8b_robotwin_planner_grounding
logging_steps: 1
save_steps: 100
plot_loss: true
overwrite_output_dir: false
save_only_model: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
fp16: false
ddp_timeout: 180000000

per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
report_to: none
